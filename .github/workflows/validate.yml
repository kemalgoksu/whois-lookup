name: Validate extension

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8'))"
      - name: Check JavaScript syntax
        run: |
          node --check background.js
          node --check popup.js
      - name: Run Mozilla extension linter
        run: npx --yes web-ext@10.6.0 lint
      - name: Verify submission package builds
        run: npx --yes web-ext@10.6.0 build --overwrite-dest
